name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
  TEST_DATABASE_NAME: "test_db_test"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=server

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Type check all workspaces
        run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=server

      - name: Run Prisma migrations
        run: |
          cd server
          npx prisma migrate deploy

      - name: Run server unit tests with coverage
        run: npm run test:coverage --workspace=server
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            server/coverage/
          retention-days: 30

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=server

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Run Prisma migrations
        run: |
          cd server
          npx prisma migrate deploy

      - name: Run API tests
        run: npm run test:api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=server

      - name: Run Prisma migrations
        run: |
          cd server
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed game data
        run: npm run db:seed --workspace=server
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      # Playwright's own webServer config (tests/playwright.config.ts) only
      # manages the client preview on :5173 — the backend the client actually
      # talks to (matchmaking/gameplay flows need a real Socket.IO + DB round
      # trip, not just static pages) has to be started separately here.
      - name: Start backend server
        run: nohup node server/dist/index.js > server.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3001
          NODE_ENV: production

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            # No root HTTP route exists — a plain 404 still proves the server
            # is up and accepting connections, which is all this needs.
            if curl -s -o /dev/null http://localhost:3001/; then exit 0; fi
            sleep 1
          done
          echo "Backend did not become reachable in time" && cat server.log && exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
          retention-days: 30

  build:
    name: Build All
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=server

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            client/dist/
            server/dist/
          retention-days: 7
